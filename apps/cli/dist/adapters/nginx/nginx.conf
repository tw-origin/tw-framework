# nginx server block for TW Framework
# Generated by `tw adapter nginx`.
#
# Place in /etc/nginx/sites-available/tw-app (symlink into sites-enabled)
# or include from your main nginx.conf. Adjust server_name and the root
# path to where the project lives on the server.
#
# Static output only (pages + pre-rendered routes). For the full server,
# run `tw serve` (or the node/bun adapter) behind nginx as a proxy:
#
#   location / {
#     proxy_pass http://127.0.0.1:8000;
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   }

server {
    listen 80;
    server_name example.com;

    # The build output — dot-prefix directories are served fine when
    # the root points directly at them.
    root /var/www/tw-app/.tw;
    index index.html;

    # Hashed assets never change — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Clean URLs: /about serves about/index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Never serve server-side sources.
    location ~ /\. { deny all; }
    location ~ \.(twm|ts|tsx|env)$ { deny all; }
}
