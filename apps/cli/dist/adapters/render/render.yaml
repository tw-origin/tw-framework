# Render blueprint for TW Framework
# Generated by `tw adapter render`.
#
# Create a new app in the Render dashboard from "Blueprint" and point it at
# this repository — the file below defines the service.

services:
  # Static output: pages + pre-rendered routes
  - type: web
    name: tw-app
    runtime: static
    buildCommand: npm install && npx tw build
    staticPublishPath: .tw
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # Full server (.twm APIs + middleware) — uncomment and run
  # `tw adapter docker` to generate the Dockerfile first:
  # - type: web
  #   name: tw-app-full
  #   runtime: docker
  #   dockerCommand: tw serve
