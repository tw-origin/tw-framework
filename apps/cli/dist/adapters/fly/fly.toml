# Fly.io deployment for TW Framework
# Generated by `tw adapter fly`.
#
# 1. Run `tw adapter docker` first — fly deploys the container image.
# 2. fly launch      (first time — picks a region, creates the app)
# 3. fly deploy
#
# The container listens on PORT (default 8000), which matches
# internal_port below. The full server (pages + .twm APIs + middleware)
# runs on every machine.

app = "tw-app"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
