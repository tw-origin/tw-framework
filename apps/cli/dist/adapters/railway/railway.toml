# Railway deployment for TW Framework
# Generated by `tw adapter railway`.
#
# Railway runs the full server in a container and injects PORT —
# the TW production server honours it automatically.
#
# 1. Run `tw adapter docker` first — this config uses the Dockerfile.
# 2. In Railway: New Project → Deploy from GitHub repo → done.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "tw serve"
  healthcheckPath = "/"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
