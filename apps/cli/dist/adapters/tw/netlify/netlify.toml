# Netlify deployment for TW Framework
# Generated by `tw adapter netlify`.

[build]
  command = "tw build"
  publish = ".tw"

# Hashed assets never change — cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Permanent redirects — extend as needed.
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301
