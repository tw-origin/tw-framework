# DigitalOcean App Platform spec for TW Framework
# Generated by `tw adapter digitalocean`.
#
# Connect the repo in the DigitalOcean control panel (Apps → Create App),
# pick the repository and branch — this spec configures the service.
#
# Static output (pages + pre-rendered routes). For the full server
# (.twm APIs + middleware), run `tw adapter docker` instead and change
# the service below to a dockerfile build.

name: tw-app
static_sites:
  - name: web
    build_command: npm install && npx tw build
    output_dir: .tw
