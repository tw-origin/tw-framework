name: Release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Tag se HI saare versions set karo — koi package kabhi miss nahi
      # hoga (v1.0.7 me create package isi wajah se atka tha).
      - name: Bump ALL package versions from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          for f in apps/cli/package.json apps/create-tw-framework/package.json; do
            sed -i 's/"version": "[^"]*"/"version": "'"$VER"'"/' "$f"
          done
          sed -i 's/TW_VERSION = "[^"]*"/TW_VERSION = "'"$VER"'"/' packages/compiler/tw/codegen/version.ts
          grep -q '"version": "'"$VER"'"' apps/cli/package.json
          grep -q '"version": "'"$VER"'"' apps/create-tw-framework/package.json
          grep -q 'TW_VERSION = "'"$VER"'"' packages/compiler/tw/codegen/version.ts

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bash scripts/typecheck.sh

      - name: Tests
        run: bun test

      - name: Build node bundle
        run: cd apps/cli && bun scripts/build-node.ts

      # Already-published version = skip, fail nahi (idempotent release)
      - name: Publish tw-framework
        run: cd apps/cli && (npm publish --access public || echo "::warning::tw-framework already published - skip")
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-tw-framework
        run: cd apps/create-tw-framework && (npm publish --access public || echo "::warning::create-tw-framework already published - skip")
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
