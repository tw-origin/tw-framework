name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test & Typecheck (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Tests (unit + e2e)
        run: bun test

      - name: Evals (outcome / scale / invariant / fuzz)
        run: bun evals/run.ts

      - name: Bench regression gate (25% tolerance vs baselines)
        run: bun bench/run.ts --check

      - name: errors.json in sync with ERROR_CODES
        run: |
          bun scripts/generate-errors-json.ts > /dev/null
          node -e "const r=require('./errors.json'); if(r.count!==Object.keys(r.codes).length){process.exit(1)}"

  node-bundle:
    name: Node bundle (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build node bundle
        run: cd apps/cli && bun scripts/build-node.ts

      - name: Smoke test (version + help)
        run: |
          node apps/cli/dist/tw.mjs --version
          node apps/cli/dist/tw.mjs help > /dev/null

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Install Chromium
        run: |
          cd scripts && npm init -y >/dev/null && npm i playwright-core && npx playwright-core install chromium

      - name: Run browser E2E
        run: |
          export NODE_PATH="$PWD/scripts/node_modules"
          node scripts/browser-e2e.mjs

  strategy-matrix:
    name: Strategy matrix (supported combos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      # The matrix lives in code (SUPPORTED_MATRIX in
      # packages/shared/tw/config/compat.ts). This job proves two things:
      #   1. every "supported" combination is conflict-free
      #   2. the real CLI agrees -- `tw doctor` exits 0 for each one
      # Combinations outside the matrix are allowed (best-effort) but are not
      # promised, and any *unsupported* pair is a hard error (exit 2).
      - name: Supported combinations are conflict-free (unit)
        run: bun test tests/strategy-compat.test.ts

      - name: tw doctor agrees on every supported combo
        run: |
          set -e
          mkdir -p /tmp/tw-matrix && cd /tmp/tw-matrix
          echo '{"name":"matrix","version":"0.0.0"}' > package.json
          fail=0
          check() {
            echo "--- $*"
            if ! bun "$GITHUB_WORKSPACE/apps/cli/tw/bin.ts" doctor --json "$@" > /tmp/tw-doctor.json; then
              echo "tw doctor rejected a supported combo:"; cat /tmp/tw-doctor.json; fail=1
            fi
          }
          check --signals=sse     --css=tss      --render=tw-vdom --runtime=bun  --cache=isr
          check --signals=ws      --css=tss      --render=tw-vdom --runtime=bun  --cache=isr
          check --signals=long-poll --css=tss    --render=tw-vdom --runtime=bun  --cache=isr
          check --signals=sse     --css=scss     --render=tw-vdom --runtime=node --cache=swr
          check --signals=long-poll --css=css    --render=none    --runtime=edge --cache=cdn --hydration=none
          check --signals=long-poll --css=tss    --render=tw-vdom --runtime=edge --cache=cdn --api=edge
          exit $fail

      - name: Unavailable option is reported (exit 3)
        run: |
          cd /tmp/tw-matrix
          set +e
          bun "$GITHUB_WORKSPACE/apps/cli/tw/bin.ts" doctor --css=tailwind > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "3" ]; then echo "expected exit 3 (tailwindcss not installed), got $code"; exit 1; fi

      - name: Unsupported combination is rejected (exit 2)
        run: |
          cd /tmp/tw-matrix
          set +e
          bun "$GITHUB_WORKSPACE/apps/cli/tw/bin.ts" doctor --signals=ws --runtime=node > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "2" ]; then echo "expected exit 2, got $code"; exit 1; fi

  examples:
    name: All examples build + serve smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build node bundle
        run: cd apps/cli && bun scripts/build-node.ts

      - name: Every example builds
        run: |
          for dir in examples/*/; do
            name="$(basename "$dir")"
            echo "::group::example $name"
            (cd "$dir" && node $GITHUB_WORKSPACE/apps/cli/dist/tw.mjs build) || { echo "::$error::example $name failed to build"; exit 1; }
            echo "::endgroup::"
          done

      - name: Serve smoke (hello-tw + kitchen-sink)
        run: |
          cd examples/hello-tw
          node $GITHUB_WORKSPACE/apps/cli/dist/tw.mjs serve --port 8123 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf -A "TWCI-smoke/1.0" http://127.0.0.1:8123/ > /dev/null && break; sleep 1; done
          curl -sf -A "TWCI-smoke/1.0" http://127.0.0.1:8123/ | grep -q "<" || { kill $SRV; exit 1; }
          kill $SRV
