name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test & Typecheck (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Tests (unit + e2e)
        run: bun test

      - name: Evals (outcome / scale / invariant / fuzz)
        run: bun evals/run.ts

      - name: Bench regression gate (25% tolerance vs baselines)
        run: bun bench/run.ts --check

      - name: errors.json in sync with ERROR_CODES
        run: |
          bun scripts/generate-errors-json.ts > /dev/null
          node -e "const r=require('./errors.json'); if(r.count!==Object.keys(r.codes).length){process.exit(1)}"

  node-bundle:
    name: Node bundle (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build node bundle
        run: cd apps/cli && bun scripts/build-node.ts

      - name: Smoke test (version + help)
        run: |
          node apps/cli/dist/tw.mjs --version
          node apps/cli/dist/tw.mjs help > /dev/null

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Install Chromium
        run: |
          cd scripts && npm init -y >/dev/null && npm i playwright-core && npx playwright-core install chromium

      - name: Run browser E2E
        run: |
          export NODE_PATH="$PWD/scripts/node_modules"
          node scripts/browser-e2e.mjs

  examples:
    name: All examples build + serve smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build node bundle
        run: cd apps/cli && bun scripts/build-node.ts

      - name: Every example builds
        run: |
          for dir in examples/*/; do
            name="$(basename "$dir")"
            echo "::group::example $name"
            (cd "$dir" && node $GITHUB_WORKSPACE/apps/cli/dist/tw.mjs build) || { echo "::$error::example $name failed to build"; exit 1; }
            echo "::endgroup::"
          done

      - name: Serve smoke (hello-tw + kitchen-sink)
        run: |
          cd examples/hello-tw
          node $GITHUB_WORKSPACE/apps/cli/dist/tw.mjs serve --port 8123 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf -A "TWCI-smoke/1.0" http://127.0.0.1:8123/ > /dev/null && break; sleep 1; done
          curl -sf -A "TWCI-smoke/1.0" http://127.0.0.1:8123/ | grep -q "<" || { kill $SRV; exit 1; }
          kill $SRV
